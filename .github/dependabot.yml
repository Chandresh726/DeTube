version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ['next', 'eslint-config-next']
      aws-sdk:
        patterns: ['@aws-sdk/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
